name: kafka-at-most-once

x-kafka: &kafka
  build:
    context: ../../kafka
  image: kafka-workload-kafka:latest
  platform: linux/amd64
  init: true
  environment: &kafka-env
    CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    NO_COLOR: "1"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
    interval: 5s
    timeout: 10s
    retries: 30

services:
  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  workload:
    build:
      context: ../workload
    image: kafka-at-most-once-workload:latest
    container_name: at-most-once-workload
    hostname: at-most-once-workload
    platform: linux/amd64
    init: true
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      STATE_DIR: /state
      FAULT_FREE_INTERVAL: ${FAULT_FREE_INTERVAL:-5m}
      FAULT_FREE_DURATION: ${FAULT_FREE_DURATION:-60s}
      NO_COLOR: "1"
    volumes:
      - workload-state:/state
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  workload-state:
